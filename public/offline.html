<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>오프라인 - 학습 멘토링</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:420px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 12px 40px #0f172a0c}
    .icon{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#2563eb;color:white;display:grid;place-items:center;font-size:30px;font-weight:800}
    h1{font-size:24px;margin:0 0 12px}p{line-height:1.65;color:#475569;margin:0 0 22px}
    button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><div class="icon">학</div><h1>인터넷 연결이 필요해요</h1><p>현재 오프라인 상태라 학습 멘토링 페이지를 불러올 수 없어요. 연결을 확인한 뒤 다시 시도해 주세요.</p><button onclick="location.reload()">다시 시도</button></main></body>
</html>
