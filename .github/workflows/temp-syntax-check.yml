name: temp-syntax-check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/patch-final-integration.cjs
      - run: node --check scripts/patch-gray-theme.cjs
